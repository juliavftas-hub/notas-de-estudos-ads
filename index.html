<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Minha primeira página HTML</title>
    <link rel= "stylesheet" href="./styles/style.css">
</head>

<body>

    <!-- Cabecalho -->
    <header>
        <h1> Eis a minha primeira página WEB - HTML</h1>
        <a href="./sobre.html">
            sobre
        </a>

    </header>


    <!-- Conteudo principal -->
    <main>
        <!-- Lista ordenada e não ordenada -->
        <section>
            <h2>Seção de Listas:</h2>
            <h3> Lista Ordenada </h3>
            <ol>
                <li>Joinville</li>
                <li>Florianópolis
                <li>Londres</li>
                </li>
            </ol>
            <ul>
                <li> Batatinha </li>
                <li> Alface </li>
                <li> Abóbora </li>

            </ul>

            <h3> Lista Não Ordenada </h3>

        </section>
        <h2>Seção de Imagens e Vídeo</h2>
        <!-- Imagens e videos -->
        <section>
            <img width="350" height="500" src="./imgs/dog.webp" alt="cachorro triste na praia">
            <!-- width altura, height largura -->
            <img width="350" height="500" src="doguinho.webp" alt="cachorro comendo batata frita">
            <img src="https://petestimacao.com.br/storage/2021/12/foto-de-cachorros-fofos_019-768x497.jpg"
                alt="um cachorro fofo">
            <br />
            <iframe width="560" height="315" src="https://www.youtube.com/embed/OfTQLxr9NIo?si=JYpQfhAvCEJlnBO5"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        </section>

        <!-- Formularios -->

        <section class="last">
            <h2>Formulário simples</h2>

            <form>
                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="batata" />

                </div>

                <div>
                    <label for="email">email</label>
                    <input type="email" id="email">
                </div>

                <div>
                    <label for="senha">senha</label>
                    <input type="password" id="senha">
                </div>

                <div>
                    <label for="mensagem">mensagem:</label>
                    <textarea id="mensagem" placeholder="batata"></textarea>
                </div>

                <div>
                    <label for="Idade">Idade</label>
                    <input type="number" id="idade" min="10" max="20">
                </div>

                <div>
                    <label for="cor">Cor:</label>
                    <input type="color" id="cor">
                </div>

                <div>
                    <label for="anexo">anexo:</label>
                    <input type="file" id="anexo">
                </div>


                <div>
                    <button type="reset">limpar</button>

                    <button type="submit">enviar</button>
                </div>



            </form>

        </section>


    </main>

    <!-- Rodape -->
    <footer>
        <p>
            &copy; Todos os direitos reservados
        </p>

    </footer>


</body>

</html>
